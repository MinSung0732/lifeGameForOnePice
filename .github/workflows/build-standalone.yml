name: Build standalone mobile HTML
on:
  push:
    branches: [main]
    paths:
      - index.template.html
      - app.js
      - events.js
      - style.css
      - mobile.css
      - assets/scenes/**
      - scripts/build-standalone.js
      - .github/workflows/build-standalone.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-standalone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build a completely offline index.html
        run: node scripts/build-standalone.js
      - name: Verify generated standalone page
        run: |
          node scripts/build-standalone.js --check
          test -s index.html
          grep -Fq 'id="one-sea-scene-catalog"' index.html
      - name: Commit generated index.html
        run: |
          if git diff --quiet -- index.html; then
            echo "Standalone page is current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Generate fully standalone index.html for mobile local file"
          git push origin HEAD:main
