name: Test testserver

on:
  push:
    branches: [testserver]
  workflow_dispatch:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Audit 1,000 baseline rule-32 lives
        if: always()
        run: CREATION_VERSION=32 node scripts/life-audit.mjs
      - name: Compare 24 baseline rule-32 choice pairs
        if: always()
        run: CREATION_VERSION=32 node scripts/choice-compare.mjs
      - name: Audit 1,000 rule-33 balanced lives
        if: always()
        run: CREATION_VERSION=33 node scripts/life-audit.mjs
      - name: Compare 24 rule-33 choice pairs
        if: always()
        run: CREATION_VERSION=33 node scripts/choice-compare.mjs
      - name: Audit 1,000 rule-34 choice-gap lives
        if: always()
        run: CREATION_VERSION=34 node scripts/life-audit.mjs
      - name: Compare 24 rule-34 choice pairs
        if: always()
        run: CREATION_VERSION=34 node scripts/choice-compare.mjs
      - name: Audit 1,000 rule-35 power-mastery lives
        if: always()
        run: CREATION_VERSION=35 node scripts/life-audit.mjs
      - name: Compare 24 rule-35 choice pairs
        if: always()
        run: CREATION_VERSION=35 node scripts/choice-compare.mjs

  balance-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baseline 1,000 rule-35 balance lives
        run: CREATION_VERSION=35 node scripts/balance-audit.mjs

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run real mobile and desktop Chrome UI smoke tests
        if: always()
        run: node scripts/browser-smoke.mjs
      - name: Upload rendered screen captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
