name: Test testserver

on:
  push:
    branches: [testserver]
  workflow_dispatch:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Simulate 1,000 lives and report event reach
        if: always()
        run: node scripts/life-audit.mjs
