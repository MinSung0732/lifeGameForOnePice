name: Test testserver

on:
  push:
    branches: [testserver]
  workflow_dispatch:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Simulate 1,000 lives and report event reach
        if: always()
        run: node scripts/life-audit.mjs
      - name: Compare 24 same-birth choice-policy pairs
        if: always()
        run: node scripts/choice-compare.mjs
      - name: Audit 1,000 new rule-30 lives
        if: always()
        run: CREATION_VERSION=30 node scripts/life-audit.mjs
      - name: Compare 24 rule-30 same-birth choice pairs
        if: always()
        run: CREATION_VERSION=30 node scripts/choice-compare.mjs
      - name: Run real mobile and desktop Chrome UI smoke tests
        if: always()
        run: node scripts/browser-smoke.mjs
      - name: Upload rendered screen captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
