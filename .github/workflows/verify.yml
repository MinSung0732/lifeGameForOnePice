name: Validate RPG site
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check events.js
          node --check app.js
      - name: Run gameplay smoke test
        run: node tests/smoke.js
      - name: Validate mobile responsive layout
        run: node tests/responsive.js
      - name: Check static entry points
        run: |
          test -s index.html
          test -s style.css
          test -s mobile.css
          test -s app.js
          test -s events.js
          test -f assets/scenes/birth-1.svg
          test -f assets/scenes/storm-3.svg
          test -s index.template.html
          test -s scripts/build-standalone.js
          grep -Fq 'id="one-sea-inline-styles"' index.html
          grep -Fq 'id="one-sea-scene-catalog"' index.html
          grep -Fq 'OneSeaOfflineScenes' index.html
      - name: Check reproducible offline build
        run: node scripts/build-standalone.js --check
