name: Validate RPG site
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Run gameplay smoke test
        run: node tests/smoke.js
      - name: Check static entry points
        run: |
          test -s index.html
          test -s style.css
          test -s app.js
          grep -Fq 'src="./app.js"' index.html
          grep -Fq 'href="./style.css"' index.html
