<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">한 사람의 바다, 폭풍 다음 날 선택 장면 PC 시안</title>
  <desc id="description">왼쪽 그림에는 부서진 배와 나침반을 든 양육자, 어린 주인공이 있다. 오른쪽에는 짧은 이야기와 결과 위험이 적힌 세 선택지가 있다.</desc>
  <defs>
    <clipPath id="scene"><rect x="54" y="154" width="758" height="426"/></clipPath>
  </defs>
  <rect width="1440" height="900" fill="#f5f1e7"/>
  <path d="M54 83H1386M54 827H1386" stroke="#b7b2a3" stroke-width="1"/>
  <path d="M54 83H312" stroke="#294d50" stroke-width="3"/>
  <text x="54" y="54" fill="#203a3b" font-family="Batang, serif" font-weight="bold" font-size="29">한 사람의 바다</text>
  <text x="575" y="52" fill="#5d6965" font-family="Malgun Gothic, sans-serif" font-size="14">하온의 기록  ·  동쪽 바다  ·  11세</text>
  <text x="1104" y="52" fill="#294d50" font-family="Malgun Gothic, sans-serif" font-size="14">원작 모드</text>
  <text x="1226" y="52" fill="#294d50" font-family="Malgun Gothic, sans-serif" font-size="14">1배속  ▾</text>
  <text x="1333" y="52" fill="#294d50" font-family="Malgun Gothic, sans-serif" font-size="14">일지</text>

  <text x="54" y="128" fill="#7b5936" font-family="Malgun Gothic, sans-serif" font-size="13" letter-spacing="2">01  시작  /  장면 09</text>
  <image x="54" y="154" width="758" height="426" xlink:href="assets/storm-harbor.png" clip-path="url(#scene)" preserveAspectRatio="xMidYMid slice"/>
  <rect x="54" y="154" width="758" height="426" fill="none" stroke="#a7a69a" stroke-width="1"/>
  <text x="54" y="606" fill="#596a68" font-family="Malgun Gothic, sans-serif" font-size="13">부서진 배 · 양육자가 쥔 나침반 · 아직 바꿀 수 없는 어제</text>

  <text x="858" y="151" fill="#7b5936" font-family="Malgun Gothic, sans-serif" font-size="13" letter-spacing="1">폭풍이 지나간 아침</text>
  <text x="856" y="205" fill="#203a3b" font-family="Batang, serif" font-weight="bold" font-size="35">배가 돌아오지 않았다</text>
  <path d="M858 225H1386" stroke="#b7b2a3" stroke-width="1"/>
  <g fill="#303d3c" font-family="Malgun Gothic, sans-serif" font-size="18">
    <text x="858" y="267">폭풍 다음 날, 가족의 작은 배가 부두 아래에</text>
    <text x="858" y="297">걸려 있었다. 양육자는 가족의 나침반을 쥔 채</text>
    <text x="858" y="327">오래 말을 잇지 못했다.</text>
    <text x="858" y="382">집의 수입도 끊겼다. 네가 앞으로 무엇을 할지</text>
    <text x="858" y="412">제안할 수 있다.</text>
  </g>
  <text x="858" y="459" fill="#7b5936" font-family="Malgun Gothic, sans-serif" font-size="13" letter-spacing="1">지금 할 일</text>
  <path d="M858 477H1386M858 554H1386M858 631H1386M858 708H1386" stroke="#b7b2a3" stroke-width="1"/>
  <g fill="#203a3b" font-family="Malgun Gothic, sans-serif" font-size="18">
    <text x="874" y="508">배를 고칠 방법을 찾는다</text>
    <text x="874" y="585">다른 배의 일을 알아본다</text>
    <text x="874" y="662">항구를 떠날 길을 찾는다</text>
  </g>
  <g fill="#5c665f" font-family="Malgun Gothic, sans-serif" font-size="13">
    <text x="874" y="534">시간이 걸림 · 배 수리 기술을 배울 수 있음</text>
    <text x="874" y="611">당장 수입 · 집에서 보내는 시간 감소</text>
    <text x="874" y="688">위험 높음 · 양육자와 떨어질 수 있음</text>
  </g>
  <g fill="#7b5936" font-family="Malgun Gothic, sans-serif" font-size="20">
    <text x="1358" y="521">↗</text><text x="1358" y="598">↗</text><text x="1358" y="675">↗</text>
  </g>

  <path d="M54 653H812" stroke="#b7b2a3" stroke-width="1"/>
  <text x="54" y="682" fill="#7b5936" font-family="Malgun Gothic, sans-serif" font-size="13" letter-spacing="1">지금의 삶</text>
  <g fill="#293e3c" font-family="Malgun Gothic, sans-serif" font-size="16">
    <text x="54" y="723">생업</text><text x="153" y="723">아직 없음</text>
    <text x="344" y="723">소속</text><text x="443" y="723">무소속</text>
    <text x="623" y="723">관계</text><text x="712" y="723">양육자</text>
    <text x="54" y="769">배운 일</text><text x="153" y="769">없음</text>
    <text x="344" y="769">목표</text><text x="443" y="769">아직 정하지 않음</text>
  </g>
  <text x="54" y="859" fill="#616a61" font-family="Malgun Gothic, sans-serif" font-size="12">화면 시안 · 게임 기능 없음 · 원고와 숫자는 검수 중</text>
  <text x="1376" y="859" text-anchor="end" fill="#616a61" font-family="Malgun Gothic, sans-serif" font-size="12">09 / 48</text>
</svg>
